{% for guest in guests %}
    <div class="flex items-center justify-between px-4 py-2.5 hover:bg-emerald-50 transition-colors duration-150 group">
        <div class="flex flex-col">
            <span class="text-sm font-semibold text-gray-700">{{ guest.firstname }} {{ guest.lastname }}</span>
            {% if guest.table_number %}
                <span class="text-[10px] font-medium text-amber-600">Currently at Table {{ guest.table_number.table_number }}</span>
            {% else %}
                <span class="text-[10px] font-medium text-emerald-600">Unassigned</span>
            {% endif %}
        </div>
        
        <button hx-post="{% url 'rsvp_manage_tables' %}"
                hx-vals='{"action": "assign_guest", "guest_id": "{{ guest.id }}", "table_id": "{{ table_id }}"}'
                hx-target="#table-arrangements-content"
                class="text-xs font-semibold bg-emerald-50 group-hover:bg-emerald-600 text-emerald-700 group-hover:text-white px-2.5 py-1 rounded-lg transition-all duration-150">
            {% if guest.table_number %}Move{% else %}Add{% endif %}
        </button>
    </div>
{% empty %}
    <div class="px-4 py-4 text-center text-xs text-gray-400 italic">
        No matching guests found
    </div>
{% endfor %}
